name: pr-and-issue
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
            filename: src/pr-issue.svg
            token: ${{ secrets.METRICS_TOKEN }}
            base: ""
            plugin_followup: yes
            plugin_followup_sections: user
