name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate metric.svg
        uses: Find-NICK/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ozzie5555
          filename: src/metric.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          plugin_activity: yes
          plugin_activity_days: 0
          plugin_activity_filter: all
          plugin_activity_limit: 10
          plugin_activity_load: 300
          plugin_activity_visibility: push, issue, pr, ref/create, ref/delete, release, wiki, fork, star, public, member
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Generate languages.svg
        uses: Find-NICK/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: src/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 5

      - name: Generate random-code-snippet.svg
        uses: Find-NICK/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: src/random-code-snippet.svg
          base: ""
          plugin_code: yes
          plugin_code_load: 400
          plugin_code_visibility: public

      - name: Generate pr-issue.svg
        uses: Find-NICK/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: src/pr-issue.svg
          base: ""
          plugin_followup: yes
          plugin_followup_sections: user

      - name: Generate habits-facts.svg
        uses: Find-NICK/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: src/habits-facts.svg
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no
          config_timezone: Asia/Jakarta

      - name: Generate followers.svg
        uses: Find-NICK/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: src/followers.svg
          base: ""
          plugin_people: yes
          plugin_people_types: followers

      - name: Commit SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          git diff --cached --quiet || git commit -m "Update metrics SVGs"
          git push
