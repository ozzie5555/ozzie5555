name: generate breakout svg

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-svg:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate light SVG (custom cyan palette)
        uses: cyprieng/github-breakout@v1
        with:
          github_username: ${{ github.repository_owner }}
          paddle_color: "#006064"
          ball_color: "#006064"
          bricks_colors: "#e0f7fa,#b2ebf2,#4dd0e1,#0097a7,#006064"
          output_path: ./output-light

      - name: Generate dark SVG (custom dark cyan palette)
        uses: cyprieng/github-breakout@v1
        with:
          github_username: ${{ github.repository_owner }}
          paddle_color: "#a6fff2"
          ball_color: "#a6fff2"
          bricks_colors: "#223843,#2a5067,#34779d,#32b6c6,#a6fff2"
          output_path: ./output-dark

      - name: Move generated SVGs to temp
        run: |
          mkdir -p /tmp/breakout-images
          mv output-light/custom.svg /tmp/breakout-images/breakout-light.svg
          mv output-dark/custom.svg /tmp/breakout-images/breakout-dark.svg

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and force-push SVGs to target branch
        run: |
          git checkout --orphan github-breakout
          git rm -rf .
          mkdir images
          mv /tmp/breakout-images/* images/
          git add images
          git commit -m "chore: update GitHub breakout SVGs" || echo "No changes to commit"
          git push --force origin github-breakout
